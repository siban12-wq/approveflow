services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: approveflow
      POSTGRES_PASSWORD: approveflow
      POSTGRES_DB: approveflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approveflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      USE_SQLITE: "false"
      DATABASE_URL: postgresql+psycopg://approveflow:approveflow@postgres:5432/approveflow
      SECRET_KEY: change-me-in-production-use-a-long-random-string
      DEMO_MODE: "true"
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
